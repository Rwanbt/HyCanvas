[package]
name = "hycanvas-desktop-preview"
version = "0.1.0"
description = "Experimental desktop wrapper for local HyCanvas"
authors = ["HyCanvas contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Rwanbt/HyCanvas"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hycanvas_desktop_preview"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
tauri = { version = "2.10.3" }
