name: Android preview APK

on:
  push:
    branches:
      - feat/android-capacitor-online
    paths:
      - "mobile/android-capacitor/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/android-capacitor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install Capacitor
        run: npm ci
      - name: Sync native assets
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon --max-workers=2 assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hycanvas-android-preview-debug
          path: mobile/android-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

